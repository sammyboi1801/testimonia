# Weekly update pull requests, grouped so there are a few a week, not dozens. Security fixes come as soon as
# GitHub knows of them. CI runs on each pull request; merge when it passes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      web-minor: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /deploy/functions
    schedule: { interval: weekly, day: monday }
    groups:
      functions: { patterns: ["*"] }
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
