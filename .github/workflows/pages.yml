# Publishes the landing page in site/ to GitHub Pages on every push that changes it.
# One-time setup: Settings → Pages → Source: "GitHub Actions". Optional repository variables
# (Settings → Secrets and variables → Actions → Variables):
#   APP_URL   where the app runs, e.g. https://hermes-agent.example.ts.net (no trailing slash)
#   SITE_URL  the page's own address with a trailing slash (default: https://<owner>.github.io/<repo>/)
name: Landing page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill in addresses
        env:
          APP_URL: ${{ vars.APP_URL || format('https://github.com/{0}', github.repository) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          for f in site/index.html site/robots.txt site/sitemap.xml; do
            sed -i "s#{{APP_URL}}#${APP_URL%/}#g; s#{{SITE_URL}}#${SITE_URL}#g" "$f"
          done
          ! grep -n "{{" site/index.html site/robots.txt site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
