# Checks the live site every 15 minutes (tools/smoke.py). When a check fails twice in a row, it opens an issue
# labelled "outage", which emails the owner; when everything passes again, it closes that issue.
# Free on a public repository. GitHub pauses scheduled workflows after 60 days without commits: re-enable it
# under Actions → Monitor if that happens.
name: Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the site
        id: smoke
        run: |
          python tools/smoke.py > report.txt 2>&1 && ok=1 || ok=0
          if [ $ok = 0 ]; then sleep 120; python tools/smoke.py > report.txt 2>&1 && ok=1 || ok=0; fi
          cat report.txt
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Open or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.smoke.outputs.ok }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')
          if [ "$OK" = 1 ]; then
            [ -n "$open" ] && gh issue close "$open" --comment "Back up: every check passes again ($RUN)."
            exit 0
          fi
          body=$(printf 'Some checks on https://testimonia.web.app failed twice, two minutes apart.\n\n```\n%s\n```\n\nLatest run: %s\n\nThe server repairs itself in most cases (watchdog, restarts). If this stays open, see "Keeping it up" in docs/DEPLOY.md.' "$(cat report.txt)" "$RUN")
          if [ -n "$open" ]; then
            # still down: refresh the report without sending another email every 15 minutes
            gh issue edit "$open" --body "$body"
            exit 0
          else
            gh label create outage --color B60205 --description "The live site is failing its checks" --force
            gh issue create --title "Site check failing" --label outage --body "$body" --assignee "${{ github.repository_owner }}"
          fi
          exit 1
