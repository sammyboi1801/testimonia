# Testimonia on any Linux VM (e.g. an Oracle Cloud Always Free Ampere instance).
#
#   Database: put it at ./data/core.db, or set TESTIMONIA_CORE_DB_URL in .env (downloaded on first start).
#
#   Public over Tailscale Funnel (no open ports, HTTPS included):
#     docker compose up -d --build
#     sudo tailscale funnel --bg 7860          → https://<machine>.<tailnet>.ts.net
#
#   Or public on the VM's own IP with Caddy (open ports 80/443 first, set SITE_ADDRESS in .env):
#     docker compose --profile caddy up -d --build
services:
  app:
    build:
      context: ../..
      args: # optional sign-in and sync: set these in .env (see web/.env.example)
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    image: testimonia
    restart: unless-stopped
    environment:
      TESTIMONIA_CORE_DB_URL: ${TESTIMONIA_CORE_DB_URL:-}
      TESTIMONIA_CORS_ORIGINS: ${TESTIMONIA_CORS_ORIGINS:-} # e.g. https://testimonia.web.app
    volumes:
      - ./data:/data/build
    ports:
      - "127.0.0.1:7860:7860" # only this machine (and Tailscale Funnel) can reach it

  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
