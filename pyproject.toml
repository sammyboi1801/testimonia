[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "testimonia"
version = "0.1.0.dev0"
description = "Open-source Bible study: Old & New Testament, the early church, manuscripts and chronology — built entirely on open data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE.md"]
requires-python = ">=3.11"
authors = [{ name = "Sam Selvaraj" }]
keywords = ["bible", "septuagint", "church-fathers", "textual-criticism", "dead-sea-scrolls", "chronology"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Religion",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pyyaml>=6.0",
  "lxml>=5.0",
  "markdown>=3.5",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "types-Markdown", "lxml-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["testimonia"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "testimonia/_schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]   # Greek/Hebrew characters are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # long SQL fixtures read better unwrapped

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["markdown.*"]
ignore_missing_imports = true
