# =====================================================================================
#  Testimonia — data source manifest
#
#  Every dataset the build downloads. The ingest pipeline reads this file; the app's
#  Credits page is generated from it. ONLY openly licensed data may be listed under
#  `sources:` — PD, CC0, CC-BY, CC-BY-SA (ShareAlike ⇒ the published core.db is CC BY-SA 4.0).
#
#  Fields: id, name, url, download (how the build fetches it), license, attribution,
#          share_alike, feeds (core tables), phase (build phase), notes.
#  Status of each line was verified on 2026-11-05 unless marked `verify: true`.
# =====================================================================================

sources:

  # ---------------------------------------------------------------- foundation
  - id: btb
    name: Bruhman Translator's Bible
    url: https://github.com/revjude/BTB
    download: git clone (or a local vault via the BTB setting)
    fetch:
      - local: BTB          # TESTIMONIA_BTB or BTB = '...' in config.toml
      - git: https://github.com/revjude/BTB
        target: btb
    license: CC-BY-SA-4.0
    attribution: "Bruhman Translator's Bible (BTB), https://github.com/revjude/BTB, CC BY-SA 4.0"
    share_alike: true
    feeds: [verse.red_letter, heading, verse_note, quotation, topic, topic_ref, verse_date, period, lexicon_entry]
    phase: 0
    notes: >
      Use BTB for what is unique to it: pericopes, BTB chronology (era/period/date/order),
      concordance topics, TSK footnotes, scripture-quoting-scripture links, compiled lexicon articles.
      Word-level data is taken from STEPBible directly. Its LXX (Apostolic Bible Polyglot) is NOT
      used until its licence is confirmed — see `verify` list below.

  - id: stepbible-tagnt
    name: STEPBible TAGNT (Translators Amalgamated Greek NT)
    url: https://github.com/STEPBible/STEPBible-Data
    download: STEPBible-Data (sparse git clone)
    fetch:
      - git: https://github.com/STEPBible/STEPBible-Data
        target: stepbible-data
        sparse: ["Translators Amalgamated OT+NT", "Versification", "Lexicons", "Morphology codes", "Proper Nouns"]
    license: CC-BY-4.0
    attribution: "STEPBible.org / Tyndale House Cambridge, CC BY 4.0"
    feeds: [token, lemma, variant_unit, variant_reading, variant_witness]
    phase: 0
    notes: Word-level NT with edition membership (NA28/27, SBL, THGNT, WH, Tregelles, TR, Byz) + variant notes. STEP book codes → OSIS map needed.

  - id: stepbible-tahot
    name: STEPBible TAHOT (Translators Amalgamated Hebrew OT)
    url: https://github.com/STEPBible/STEPBible-Data
    download: STEPBible-Data (sparse git clone)
    fetch:
      - git: https://github.com/STEPBible/STEPBible-Data
        target: stepbible-data
        sparse: ["Translators Amalgamated OT+NT", "Versification", "Lexicons", "Morphology codes", "Proper Nouns"]
    license: CC-BY-4.0
    attribution: "STEPBible.org / Tyndale House Cambridge, CC BY 4.0"
    feeds: [token, lemma, variant_unit, variant_reading, variant_witness]
    phase: 0
    notes: Leningrad text with Qere/Ketiv and variant codes (Aleppo, BHS, Cairensis, DSS, LXX-retroverted…).

  - id: stepbible-tvtms
    name: STEPBible TVTMS (versification mapping)
    url: https://github.com/STEPBible/STEPBible-Data
    download: STEPBible-Data (sparse git clone)
    fetch:
      - git: https://github.com/STEPBible/STEPBible-Data
        target: stepbible-data
        sparse: ["Translators Amalgamated OT+NT", "Versification", "Lexicons", "Morphology codes", "Proper Nouns"]
    license: CC-BY-4.0
    attribution: "STEPBible.org / Tyndale House Cambridge, CC BY 4.0"
    feeds: [versification, verse_map]
    phase: 0

  - id: stepbible-lexicons
    name: STEPBible TBESG / TBESH lexicons and TIPNR proper names
    url: https://github.com/STEPBible/STEPBible-Data
    download: STEPBible-Data (sparse git clone)
    fetch:
      - git: https://github.com/STEPBible/STEPBible-Data
        target: stepbible-data
        sparse: ["Translators Amalgamated OT+NT", "Versification", "Lexicons", "Morphology codes", "Proper Nouns"]
    license: CC-BY-4.0
    attribution: "STEPBible.org / Tyndale House Cambridge, CC BY 4.0"
    feeds: [lemma, lexicon, lexicon_entry, person, place, person_ref, place_ref]
    phase: 0

  - id: oshb
    name: Open Scriptures Hebrew Bible (WLC + morphology)
    url: https://github.com/openscriptures/morphhb
    download: git clone
    fetch:
      - git: https://github.com/openscriptures/morphhb
        target: oshb
        sparse: [wlc]
    license: "PD (WLC text) + CC-BY-4.0 (lemmas/morphology)"
    attribution: "Open Scriptures Hebrew Bible, CC BY 4.0; Westminster Leningrad Codex (public domain)"
    feeds: [edition_verse, token]
    phase: 0

