      eng-Brenton: { id: brenton,  abbrev: LXX-E,   title: "Brenton's English Septuagint", year: 1851, base: LXX, versification: lxx, license: PD }
      latVUC:      { id: vulgate,  abbrev: VUL,     title: "Clementine Vulgate", year: 1592, base: Vulgate, versification: vul, license: PD, language: lat }

  - id: crosswire-pd
    name: CrossWire SWORD modules (public-domain texts only)
    url: https://crosswire.org/sword/modules/
