      biblical places, so Pleiades is used by reference only: place pages link to pleiades.stoa.org/places/<id>.

  - id: itinere
    name: Itiner-e — Roman road network
    url: https://doi.org/10.5281/zenodo.17122148
    download: Zenodo archive
    license: CC-BY-4.0
    attribution: "Itiner-e, CC BY 4.0"
    feeds: [geo_feature]
    phase: 4
    notes: >
      Not yet ingested: the only downloads (v1.3) are a 78 MB GeoJSON, a 34 MB GeoPackage and a 138 MB shapefile.
      A Roman-roads layer for the atlas needs a clipped, simplified extract made from one of them.

  - id: natural-earth
    name: Natural Earth (land, coastlines, rivers and lakes, 1:10m)
    url: https://www.naturalearthdata.com/
    download: shapefile zips from naciscdn.org (land 5.1.1, lakes and rivers 5.0.0, coastline 5.0.0-pre9 as published; hash-locked in sources.lock.json), turned into the atlas basemap by tools/build_basemap.py
    fetch:
      - http: https://naciscdn.org/naturalearth/10m/physical/ne_10m_land.zip
        target: natural-earth
        extract: true
      - http: https://naciscdn.org/naturalearth/10m/physical/ne_10m_coastline.zip
        target: natural-earth
        extract: true
      - http: https://naciscdn.org/naturalearth/10m/physical/ne_10m_rivers_lake_centerlines.zip
        target: natural-earth
        extract: true
      - http: https://naciscdn.org/naturalearth/10m/physical/ne_10m_lakes.zip
        target: natural-earth
        extract: true
    license: PD
    attribution: "Made with Natural Earth. Free vector and raster map data @ naturalearthdata.com (public domain)"
    feeds: []
    phase: 4
    notes: >
      Public domain (naturalearthdata.com/about/terms-of-use). Clipped to the Mediterranean and Near East,
      simplified and shipped as web/public/atlas/basemap.json, so the atlas needs no tile server.

  - id: helloao-commentaries
    name: HelloAO Free Use Bible API — public-domain commentaries
    url: https://bible.helloao.org/
    download: "per-chapter JSON (api/c/{id}/{book}/{ch}.json)"
    license: PD (Henry, JFB, Clarke, Gill, Keil-Delitzsch, Calvin); Tyndale Open Study Notes CC-BY-SA-4.0
    attribution: "Commentaries via the HelloAO Free Use Bible API"
    feeds: [commentary, commentary_entry]
    phase: 4

  - id: testimonia-curated
    name: Testimonia curated tables (this repository, curated/)
    kind: curated
    url: (this repo)
    download: (in repo)
    license: CC-BY-SA-4.0
    attribution: "Testimonia contributors, CC BY-SA 4.0"
    share_alike: true
    feeds: [chronology_system, period, dating, office_holding, event, canon_list, canon_list_item, canon_tradition, canon_book, work, person]
    phase: 0
    notes: Hand-encoded from public-domain primary sources and CC BY-SA Wikipedia tables (cited per row).

# Live APIs — queried at runtime, cached in user.db, never bundled.
live_apis:
  - { id: openalex, url: "https://api.openalex.org", license: CC0-1.0, notes: "free key recommended ($1/day budget)" }
  - { id: crossref, url: "https://api.crossref.org", license: "metadata facts", notes: "mailto= polite pool" }
  - { id: doaj,     url: "https://doaj.org/api",      license: CC-BY-SA-4.0 }
  - { id: internet-archive, url: "https://archive.org/advancedsearch.php", notes: "PD scholarly books (Tischendorf, Swete, Westcott-Hort)" }

# Pending research / licence verification before use.
verify:
  - btb-lxx: "BTB's LXX derives from the Apostolic Bible Polyglot (© Charles Van der Pool?) — confirm licence; else use Swete + Brenton."
  - ccel-permission: "Ask CCEL for permission to redistribute ThML-derived data (would let core.db ship the ANF/NPNF library + scripRef index)."
  - brownlee-1951: "Brownlee, The Dead Sea Manual of Discipline (ASOR 1951, English 1QS) — no renewal found, possibly PD; no digital copy located."
  - burrows-1950-v1: "Burrows, St. Mark's Monastery vol. 1 (1950, 1QIsaᵃ + 1QpHab) — probably PD by non-renewal; only a restricted archive.org lending copy found."
  - dare-tiles: "DARE / AWMC map tile licences (CC BY 4.0 vs older NC terms)."

# Explicitly excluded (not open). Kept here so nobody re-adds them.
excluded:
