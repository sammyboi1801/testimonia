  # ---------------------------------------------------------------- Jewish & Roman witnesses
  - id: ccel-josephus
    name: CCEL ThML — The Works of Flavius Josephus (tr. William Whiston, 1737)
    url: https://ccel.org/ccel/josephus/complete
    download: https://ccel.org/ccel/josephus/complete.xml — fetched on the user's machine at build time
    public: false   # same CCEL policy as ccel-schaff (texts PD; CCEL asks permission before republishing its files)
    fetch:
      - http: https://ccel.org/ccel/josephus/complete.xml
        target: witnesses
        filename: josephus-whiston.xml
    license: PD (Whiston 1737)
    attribution: "Flavius Josephus, tr. William Whiston (1737); digital text courtesy of the Christian Classics Ethereal Library"
    feeds: [work, work_edition, work_section, citation]
    phase: 1
    notes: Life, Antiquities, Jewish War, Against Apion (the spurious Discourse on Hades is skipped). Whiston's footnotes carry scripRef links.

  - id: perseus-tacitus
    name: Tacitus, Annals — tr. A. J. Church & W. J. Brodribb (1876), Perseus TEI
    url: https://github.com/PerseusDL/canonical-latinLit
    download: raw TEI file from the canonical-latinLit repository
    fetch:
      - http: https://raw.githubusercontent.com/PerseusDL/canonical-latinLit/master/data/phi1351/phi005/phi1351.phi005.perseus-eng2.xml
        target: witnesses
        filename: tacitus-annals-eng.xml
    license: CC-BY-SA-4.0
    share_alike: true
    attribution: "Tacitus, Annals, tr. A. J. Church & W. J. Brodribb (1876); TEI by the Perseus Digital Library, CC BY-SA 4.0"
    feeds: [work, work_edition, work_section]
    phase: 1

  - id: pd-roman-witnesses
    name: Suetonius, Pliny the Younger and Lucian in public-domain translations
    url: https://www.gutenberg.org/
    download: plain-text files from the Project Gutenberg cache (ebooks 6400, 2811, 47242)
    fetch:
      - http: https://www.gutenberg.org/cache/epub/6400/pg6400.txt
        target: witnesses
        filename: suetonius-thomson-forester.txt
      - http: https://www.gutenberg.org/cache/epub/2811/pg2811.txt
        target: witnesses
        filename: pliny-letters-melmoth.txt
      - http: https://www.gutenberg.org/cache/epub/47242/pg47242.txt
        target: witnesses
        filename: lucian-fowler-vol4.txt
    license: PD
    attribution: "Suetonius, Lives of the Caesars, tr. A. Thomson rev. T. Forester (1855); Pliny the Younger, Letters, tr. W. Melmoth rev. F. C. T. Bosanquet; Lucian, tr. H. W. and F. G. Fowler (Oxford, 1905) — public domain"
    feeds: [work, work_edition, work_section]
    phase: 1
    notes: >
      Only the passages bearing on Christ and the first Christians are imported: Suetonius' Lives of Claudius
      and Nero, Pliny's letters 10.96–97 (Melmoth XCVII–XCVIII), Lucian's Death of Peregrine. The Gutenberg
      header, footer and licence are stripped and the texts are not presented as Project Gutenberg editions
      (Project Gutenberg licence §1.C).

  - id: hcf-commentaries
    name: HistoricalChristianFaith Commentaries-Database
    url: https://github.com/HistoricalChristianFaith/Commentaries-Database
    download: git clone (pinned commit; the release asset is rebuilt daily so it is not reproducible)
    fetch:
      - git: https://github.com/HistoricalChristianFaith/Commentaries-Database
        target: hcf-commentaries
    license: PD (public-domain dedication)
    attribution: "Historical Christian Faith Commentaries Database (public domain)"
    feeds: [commentary, commentary_entry, person]
    phase: 1
    notes: Patristic authors up to AD 451 (overwhelmingly from the public-domain ANF/NPNF translations). Later authors are the separate source hcf-commentaries-later; authors after 1900 are never imported.

  - id: hcf-commentaries-later
    name: HistoricalChristianFaith Commentaries-Database — authors after AD 451
    url: https://github.com/HistoricalChristianFaith/Commentaries-Database
    download: same checkout as hcf-commentaries
    license: PD (public-domain dedication; some excerpts claimed as fair use)
    attribution: "Historical Christian Faith Commentaries Database"
    public: false   # translations of later authors may be modern or machine-made; not yet verified per excerpt
    feeds: [commentary, commentary_entry, person]
    phase: 1
    fetch:
      - git: https://github.com/HistoricalChristianFaith/Commentaries-Database
        target: hcf-commentaries
    notes: >
      Medieval and early-modern authors (452–1900) and undated pseudonymous works. Local builds only until the
      translations behind these excerpts are checked; authors after 1900 are never imported.

  - id: catena-aurea
    name: Thomas Aquinas, Catena Aurea (Newman translation, 1841)
    url: https://www.ccel.org/ccel/aquinas/catena1.xml
    download: as ccel-schaff (build-time fetch) or Wikisource
    public: false   # CCEL-hosted digital text: local use only for now
    fetch:
      - http: https://www.ccel.org/ccel/aquinas/catena1.xml
        target: ccel
      - http: https://www.ccel.org/ccel/aquinas/catena2.xml
        target: ccel
    license: PD
    attribution: "Catena Aurea, trans. J.H. Newman (1841), public domain"
    notes: CCEL hosts ThML for vol. 1 (Matthew) and vol. 2 (Mark) only; Luke and John to come from Wikisource.
    feeds: [commentary, commentary_entry]
    phase: 1

